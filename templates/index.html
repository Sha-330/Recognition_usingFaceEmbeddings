<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Association Day 2025 - Face ID Verify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        :root {
            --primary-blue: #00bfff;
            --primary-orange: #ff8c00;
            --dark-bg: #0d0a1b;
            --glow-color-1: #00f0ff;
            --glow-color-2: #ffc800;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
            margin: 0;
        }

        .scanner-container {
            width: 300px;
            height: 300px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-placeholder {
            width: 150px;
            height: 150px;
            border: 2px solid var(--glow-color-1);
            position: relative;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; 
            transition: opacity 0.5s;
        }

        .camera-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--glow-color-1), transparent);
            animation: scanLine 2s infinite ease-in-out alternate;
            box-shadow: 0 0 15px var(--glow-color-1);
        }

        .scanner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px dashed var(--glow-color-1);
            border-radius: 50%;
            opacity: 0.8;
            animation: rotateRing 15s linear infinite;
            filter: drop-shadow(0 0 10px var(--glow-color-1));
        }
        
        .scanner-glow {
            position: absolute;
            width: 90%;
            height: 90%;
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.7);
            animation: pulseGlow 4s infinite ease-in-out;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        @keyframes scanLine {
            0% { top: 0; }
            100% { top: calc(100% - 4px); }
        }

        .main-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background-color: var(--dark-bg);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 3rem;
            box-sizing: border-box;
        }

        .light-trail {
            position: absolute;
            filter: blur(50px);
            opacity: 0.5;
            z-index: 1;
            mix-blend-mode: screen;
        }

        .light-trail.orange {
            background: radial-gradient(circle at 70% 50%, var(--primary-orange), transparent 50%);
            width: 60%;
            height: 40%;
            top: 20%;
            left: -10%;
            animation: moveTrail1 20s infinite alternate;
        }

        .light-trail.blue {
            background: radial-gradient(circle at 30% 50%, var(--primary-blue), transparent 60%);
            width: 70%;
            height: 50%;
            bottom: 10%;
            right: -20%;
            animation: moveTrail2 25s infinite alternate;
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: var(--glow-color-2);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--glow-color-2);
            animation: floatParticle 10s infinite linear;
            z-index: 2;
        }

        .particle:nth-child(2n) { background-color: var(--glow-color-1); box-shadow: 0 0 5px var(--glow-color-1); }
        .particle:nth-child(3n) { animation-duration: 15s; }
        .particle:nth-child(5n) { animation-duration: 8s; }

        @keyframes moveTrail1 {
            from { transform: translateX(0); }
            to { transform: translateX(10%); }
        }

        @keyframes moveTrail2 {
            from { transform: translateX(0); }
            to { transform: translateX(-10%); }
        }
        
        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50% { transform: translate(10vw, 5vh) scale(1.2); opacity: 1; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
        }

        .content-area {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        .title-block {
            max-width: 45%;
        }

        .verify-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
        }

        .verify-button:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 191, 255, 1);
            transform: translateY(-2px);
        }

        .verify-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 1024px) {
            .main-container {
                width: 95vw;
                padding: 2rem;
            }
            .title-block h1 {
                font-size: 3rem;
            }
            .scanner-container {
                width: 280px;
                height: 280px;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }
            
            .main-container {
                width: 95vw;
                padding: 1.5rem;
                aspect-ratio: auto;
                min-height: 100vh;
                border-radius: 0;
            }
            
            .content-area {
                flex-direction: column;
                justify-content: center;
                gap: 2rem;
                text-align: center;
            }
            
            .title-block {
                max-width: 100%;
                margin-top: 0;
            }
            
            .title-block h1 {
                font-size: 2.5rem !important;
                line-height: 1.2;
            }
            
            .title-block p {
                font-size: 1.125rem;
            }
            
            .scanner-container {
                width: 220px;
                height: 220px;
            }
            
            .camera-placeholder {
                width: 130px;
                height: 130px;
            }
            
            .verify-button {
                width: 100%;
                max-width: 320px;
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }
            
            .title-block h1 {
                font-size: 2rem !important;
            }
            
            .title-block p {
                font-size: 1rem;
            }
            
            .scanner-container {
                width: 180px;
                height: 180px;
            }
            
            .camera-placeholder {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="light-trail orange"></div>
    <div class="light-trail blue"></div>
    <div class="particle" style="top: 5%; left: 10%;"></div>
    <div class="particle" style="top: 20%; right: 5%;"></div>
    <div class="particle" style="bottom: 15%; left: 30%;"></div>
    <div class="particle" style="bottom: 5%; right: 40%;"></div>
    <div class="particle" style="top: 40%; left: 60%;"></div>
    <div class="particle" style="top: 70%; right: 70%;"></div>
    <div class="particle" style="bottom: 25%; left: 80%;"></div>
    <div class="particle" style="top: 50%; right: 20%;"></div>
    
    <div class="relative z-20 w-full h-full flex flex-col justify-between">
        <header class="top-header flex items-center justify-start mb-6 md:mb-10">
            <img 
                src="https://ucarecdn.com/39c3f2ff-286e-4661-ac7f-32a6d5e8db07/AdobeExpressfile.png" 
                alt="Department Logo" 
                class="w-36 h-36 sm:w-48 sm:h-48 mr-6 sm:mr-8 flex-shrink-0 object-cover"
            />
            <div class="text-white">
                <p class="text-xs sm:text-sm opacity-80">Department of Artificial</p>
               <h2 class="text-xl sm:text-2xl font-semibold leading-tight">Intelligence and Data Science</h2>
            </div>
        </header>
    </div>

        <div class="content-area flex-grow">
            <div class="title-block">
                <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-white mb-4 leading-tight">
                    Welcome to <br>Association Day 2025
                    <span class="text-red-500 text-4xl sm:text-5xl md:text-6xl ml-3 relative inline-block">
                        &times;
                        <span class="absolute -top-2 sm:-top-3 md:-top-4 -right-1 sm:-right-2 text-yellow-300 text-base sm:text-lg md:text-xl">*</span>
                    </span>
                </h1>
                <p class="text-base sm:text-lg md:text-xl font-medium text-yellow-400 opacity-90">Your Smile Is Your Pass!</p>
            </div>

            <div class="scanner-container">
                <div class="scanner-ring"></div>
                <div class="scanner-glow"></div>
                <div class="camera-placeholder">
                    <video id="webcamVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
                    <canvas id="captureCanvas" style="display:none;"></canvas>
                </div>
            </div>
        </div>

        <div class="flex justify-center w-full mt-10">
            <button id="verifyButton"
                class="verify-button px-10 py-4 text-lg font-bold text-white rounded-full 
                       bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 
                       focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">
                Verify with Face ID
            </button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000';
    const webcamVideo = document.getElementById('webcamVideo');
    const captureCanvas = document.getElementById('captureCanvas');
    const verifyButton = document.getElementById('verifyButton');
    const titleBlock = document.querySelector('.title-block');
    const initialTitleHTML = titleBlock.innerHTML;

    let stream = null;
    let cameraReady = false;

    function displayMessage(message, subMessage, isError = false, showLoader = false) {
        let loader = showLoader ? '<span class="animate-spin inline-block ml-3">🌀</span>' : '';
        let mainColor = isError ? 'text-red-500' : 'text-white';
        let subColor = isError ? 'text-red-400' : 'text-yellow-400';

        titleBlock.innerHTML = `
            <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold ${mainColor} mb-4 leading-tight">
                ${message} ${loader}
            </h1>
            <p class="text-base sm:text-lg md:text-xl font-medium ${subColor} opacity-90">
                ${subMessage}
            </p>
        `;
    }

    function captureFrame() {
        const canvas = captureCanvas;
        const context = canvas.getContext('2d');
        canvas.width = webcamVideo.videoWidth;
        canvas.height = webcamVideo.videoHeight;
        context.drawImage(webcamVideo, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.95);
    }

    async function verifyFace() {
        if (!cameraReady) {
            displayMessage('Camera Not Ready', 'Please wait for camera to initialize', true);
            return;
        }

        displayMessage('Scanning Face...', 'Analyzing biometric data...', false, true);
        verifyButton.textContent = "Verifying...";
        verifyButton.disabled = true;

        try {
            const imageData = captureFrame();
            
            const response = await fetch(`${API_URL}/api/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image: imageData })
            });

            const result = await response.json();

            if (result.success) {
                displayMessage('Access Granted ✓', `Welcome, ${result.name}!`, false, false);
                verifyButton.textContent = `Welcome ${result.name}! Redirecting...`;
                
                setTimeout(() => {
                    window.location.href = `/welcome?name=${encodeURIComponent(result.name)}`;
                }, 1500);
            } else {
                displayMessage('Access Denied', result.message || 'Face not recognized', true, false);
                verifyButton.textContent = "Try Again";
                verifyButton.disabled = false;
                
                setTimeout(() => {
                    titleBlock.innerHTML = initialTitleHTML;
                    verifyButton.textContent = "Verify with Face ID";
                }, 3000);
            }

        } catch (error) {
            console.error('Verification error:', error);
            displayMessage('Connection Error', 'Could not reach verification server', true, false);
            verifyButton.textContent = "Retry";
            verifyButton.disabled = false;
            
            setTimeout(() => {
                titleBlock.innerHTML = initialTitleHTML;
                verifyButton.textContent = "Verify with Face ID";
            }, 3000);
        }
    }

    async function startWebcam() {
        if (cameraReady) {
            await verifyFace();
            return;
        }

        displayMessage('Activating Camera...', 'Please grant access to your webcam.');
        verifyButton.textContent = "Activating Camera...";
        verifyButton.disabled = true;
        verifyButton.classList.add('animate-pulse');

        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: 'user'
                }
            });
            
            webcamVideo.srcObject = stream;
            
            webcamVideo.onloadedmetadata = () => {
                webcamVideo.play();
                webcamVideo.style.opacity = 1;
                cameraReady = true;
                
                displayMessage('Ready for Face ID', 'Click the button to start verification!');
                verifyButton.textContent = "Start Face Scan";
                verifyButton.classList.remove('animate-pulse');
                verifyButton.disabled = false;
            };

        } catch (err) {
            console.error("Camera error:", err);
            let errorMessage = "Camera Access Denied";
            let subMessage = "Please check browser permissions and try again.";
            
            if (err.name === 'NotFoundError' || err.name === 'NotReadableError') {
                errorMessage = "No Camera Found";
                subMessage = "Ensure a webcam is connected and not in use.";
            }

            displayMessage(errorMessage, subMessage, true);
            verifyButton.textContent = "Camera Error";
            verifyButton.classList.remove('animate-pulse');
            verifyButton.disabled = true;
        }
    }

    async function checkServerStatus() {
        try {
            const response = await fetch(`${API_URL}/api/status`);
            const data = await response.json();
            console.log('Server status:', data);
            return data.status === 'online';
        } catch (error) {
            console.error('Server not reachable:', error);
            displayMessage('Server Offline', 'Cannot connect to verification server', true);
            verifyButton.disabled = true;
            return false;
        }
    }

    verifyButton.addEventListener('click', () => {
        if (!cameraReady) {
            startWebcam();
        } else {
            verifyFace();
        }
    });

    window.addEventListener('beforeunload', () => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    });

    checkServerStatus();
</script>

</body>
</html>
